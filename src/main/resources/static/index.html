<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ef">
  <title>Boundary | Cricket scorebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#overview" aria-label="Boundary home">
        <span class="brand-mark"><span></span></span>
        <span>boundary<span class="brand-dot">.</span></span>
      </a>
      <div class="club-label">MATCH CENTRE</div>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-link active" data-view="overview"><span class="nav-icon">◫</span> Overview</button>
        <button class="nav-link" data-view="matches"><span class="nav-icon">▤</span> Matches <span class="nav-count" id="match-count">0</span></button>
        <button class="nav-link" data-view="teams"><span class="nav-icon">♧</span> Teams</button>
        <button class="nav-link" data-view="players"><span class="nav-icon">♙</span> Players</button>
      </nav>
      <div class="sidebar-rule"></div>
      <div class="club-label">YOUR SEASON</div>
      <div class="season-chip"><span class="season-dot"></span><span><strong>City League</strong><small>Summer · 2025</small></span><span class="season-arrow">⌄</span></div>
      <div class="sidebar-bottom">
        <div class="sync-status"><span class="sync-dot"></span><span>Scorebook ready</span></div>
        <div class="profile"><div class="avatar">JD</div><span><strong>Jordan Davis</strong><small>Scorekeeper</small></span><button class="more-button" aria-label="Profile options">···</button></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumb"><span>City League</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
        <div class="topbar-actions">
          <div class="date-label"><span class="date-icon">◷</span><span id="today-label"></span></div>
          <button class="button button-dark button-small" id="new-match-top"><span class="plus">+</span> New match</button>
        </div>
      </header>

      <div class="page-wrap" id="page-wrap"></div>
    </main>
  </div>

  <div class="modal-layer" id="modal-layer" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
